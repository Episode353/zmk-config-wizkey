# Disable sleep since we're using USB power
CONFIG_ZMK_SLEEP=n

# Disable Bluetooth and split communication
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=n

# Enable USB
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# Name
CONFIG_ZMK_KEYBOARD_NAME="Wizkey Left"

# HID reports
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
